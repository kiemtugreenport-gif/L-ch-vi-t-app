name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Giai nen
        run: unzip -q lich-viet-app.zip -d app
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build APK
        working-directory: app
        run: |
          npm install
          npx cap add android
          npx cap sync android
          cp -r native/java/. android/app/src/main/java/com/lichviet/app/
          cp -r native/res/. android/app/src/main/res/
          python3 native/patch_android.py
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: lich-viet-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
